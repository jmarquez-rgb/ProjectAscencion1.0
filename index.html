<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project Ascencion 2.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1319">
<meta name="color-scheme" content="dark">
<meta name="description" content="Training, recovery and fuel tracker. Data stays on your device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ascencion">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Project Ascencion <span class="ver">2.0</span></div>
    <div id="topDate" class="muted small"></div>
  </header>
  <div id="banner"></div>
  <main id="view" tabindex="-1" aria-live="polite"></main>
</div>
<div id="restBar" class="restbar" role="timer"></div>
<nav id="tabs" aria-label="Main">
  <button data-act="tab" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Today</span></button>
  <button data-act="tab" data-tab="train"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9v6M5 6v12M19 6v12M22 9v6M5 12h14"/></svg><span>Train</span></button>
  <button data-act="tab" data-tab="fuel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v8a3 3 0 0 0 3 3v7M9 3v8M12 3v8M17 3c-2 2-3 5-3 8h3v10"/></svg><span>Fuel</span></button>
  <button data-act="tab" data-tab="body"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><path d="M12 8v7M7 11h10M9 21l3-6 3 6"/></svg><span>Body</span></button>
  <button data-act="tab" data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg><span>Progress</span></button>
  <button data-act="tab" data-tab="data"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span>Data</span></button>
</nav>
<div id="sheetRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px;color:#ebe7de">Project Ascencion needs JavaScript turned on.</p></noscript>
<script src="app.js"></script>
</body>
</html>
